version: 2
updates:
  # サーバー側 (Root) - 日次 (JST 19:00)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "19:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # クライアント側 (Client) - 日次 (JST 19:00)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "daily"
      time: "19:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps-client)"

  # GitHub Actions ワークフロー - 週次 (月曜 JST 19:00)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(ci)"

  # Dockerfile ベースイメージ - 週次 (月曜 JST 19:00)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore(docker)"
