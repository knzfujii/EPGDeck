name: CI (All-in-One Check)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Core Verification & E2E (Node 22)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epgdeck
          MYSQL_USER: epgdeck
          MYSQL_PASSWORD: epgdeck
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epgdeck
          MYSQL_USER: epgdeck
          MYSQL_PASSWORD: epgdeck
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Lint Check (Server)
        run: npm run lint:check

      - name: Prettier Format Check (Server)
        run: npm run format:check

      - name: TypeScript Compile (Server)
        run: npm run compile

      - name: Svelte & TypeScript Check (Client)
        run: npm --prefix client run check

      - name: Build Check (Client)
        run: npm --prefix client run build

      - name: Security Audit (Warning only)
        run: |
          npm audit || true
          npm --prefix client audit || true

      - name: Run Unit Tests (SQLite)
        run: npm test

      - name: Run Integration Tests (MariaDB 10.11)
        env:
          TEST_MYSQL: 'true'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: epgdeck
          MYSQL_PASSWORD: epgdeck
          MYSQL_DATABASE: epgdeck
        run: npm run test:mysql

      - name: Run Integration Tests (MySQL 8.0)
        env:
          TEST_MYSQL: 'true'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3307
          MYSQL_USER: epgdeck
          MYSQL_PASSWORD: epgdeck
          MYSQL_DATABASE: epgdeck
        run: npm run test:mysql

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(npx playwright --version)" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload E2E Test Artifacts (Report & Server Logs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            logs/test_e2e.log
          retention-days: 7

