# ==============================================================================
# EPGDeck Test Configuration (E2E)
# ==============================================================================

server:
    port: 18889
    mirakurun: http://localhost:40772
    isAllowAllCORS: true

database:
    type: sqlite

log:
    level: info
    console: false
    file:
        enabled: false
        path: '%ROOT%/logs/test_epgdeck.log'
    bufferSize: 1000

epg:
    intervalMinutes: 10
    replaceEnclosingCharacters: true

recording:
    filenameFormat: '%YEAR%年%MONTH%月%DAY%日%HOUR%時%MIN%分%SEC%秒-%TITLE%'
    fileExtension: .m2ts
    directories:
        - name: test_recorded
          path: '%ROOT%/data/test_e2e_env/recorded'
    historyRetentionDays: 90
    storageCheckIntervalSeconds: 60
    priority:
        recording: 2
        conflict: 1
        streaming: 0
    timeSpecifiedStartMargin: 1
    timeSpecifiedEndMargin: 2
    thumbnail:
        path: '%ROOT%/data/test_e2e_env/thumbnail'
        size: 480x270
        positionSeconds: 5
    dropLog:
        enabled: false
        path: '%ROOT%/data/test_e2e_env/drop'
    uploadTempDir: '%ROOT%/data/test_e2e_env/upload'

encode:
    binaries:
        ffmpeg: ffmpeg
        ffprobe: ffprobe
    maxProcesses: 1
    concurrency: 1
    presets: []

urlscheme:
    m2ts:
        ios: 'vlc-x-callback://x-callback-url/stream?url=PROTOCOL%3A%2F%2FADDRESS'
        android: 'intent://ADDRESS#Intent;action=android.intent.action.VIEW;type=video/*;scheme=PROTOCOL;end'
    video:
        ios: 'infuse://x-callback-url/play?url=PROTOCOL://ADDRESS'
        android: 'intent://ADDRESS#Intent;action=android.intent.action.VIEW;type=video/*;scheme=PROTOCOL;end'
    download:
        ios: 'vlc-x-callback://x-callback-url/download?url=PROTOCOL%3A%2F%2FADDRESS&filename=FILENAME'
